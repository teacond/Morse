name: CI

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      job:
        description: "Job"
        required: true
        type: choice
        options:
          - All
          - Flatpak
          - MacOS
          - Windows
          - Debian
          - Binary (Linux)

jobs:
  build-flatpak:
    name: "Flatpak"
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'All' || inputs.job == 'Flatpak')) ||
      github.event_name != 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{matrix.runner}}
    steps:
      - uses: actions/checkout@v7
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: morse-linux-${{matrix.arch}}.flatpak
          manifest-path: build-aux/flatpak/io.github.teacond.Morse.json
          cache-key: flatpak-builder-${{github.sha}}
          arch: ${{matrix.arch}}
          verbose: true
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        with:
          name: morse-flatpak-${{matrix.arch}}
          path: morse-linux-${{matrix.arch}}.flatpak
  
  build-windows:
    name: Windows
    if: |
      github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'All' || inputs.job == 'Windows'))
    env:
      PYTHONUTF8: "1"
    strategy:
      matrix:
        include:
          - arch-name: x86_64
            sys: clang64
            env: clang-x86_64
            runner: windows-latest
            arch: x64compatible
          - arch-name: aarch64
            sys: clangarm64
            env: clang-aarch64
            runner: windows-11-arm
            arch: arm64
    runs-on: ${{matrix.runner}}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - name: "Setup MSYS2"
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{matrix.sys}}
          update: true
          install: >-
            mingw-w64-${{matrix.env}}-git mingw-w64-${{matrix.env}}-meson
            mingw-w64-${{matrix.env}}-gettext mingw-w64-${{matrix.env}}-rust
            mingw-w64-${{matrix.env}}-gtk4 mingw-w64-${{matrix.env}}-libadwaita
            mingw-w64-${{matrix.env}}-blueprint-compiler
      - name: Build Package
        run: |
          meson setup build -Dprefix=$(pwd)/dist -Dprofile=default
          meson install -C build
          ldd dist/bin/morse.exe | grep /${{matrix.sys}}/bin | cp $(awk '{print $3}') dist/bin
          cp /${{matrix.sys}}/bin/gdbus.exe dist/bin
          mkdir -p dist/lib/gdk-pixbuf-2.0
          cp -r /${{matrix.sys}}/lib/gdk-pixbuf-2.0/* dist/lib/gdk-pixbuf-2.0
      - name: Build Installer
        shell: powershell
        run: |
          pip install meson
          $AppVersion = (meson introspect --projectinfo build | ConvertFrom-Json).version
          iscc /DCPUType=${{matrix.arch}} /DOutputFilename=morse-windows-${{matrix.arch-name}} /DVersion="$AppVersion" build-aux/windows/morse_inno.iss
      - uses: actions/upload-artifact@v7
        with:
          name: morse-windows-${{matrix.arch-name}}
          path: Output/*.exe
  
  build-macos:
    name: MacOS
    runs-on: macos-26
    if: |
      github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'All' || inputs.job == 'MacOS'))
    steps:
      - uses: actions/checkout@v7
      - name: "Install System Packages"
        run: |
          brew update
          brew install meson gettext rust gtk4 libadwaita blueprint-compiler create-dmg dylibbundler librsvg
      - name: Build Package
        shell: zsh {0}
        run: |
          ./build-aux/macos/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: morse-macos-aarch64
          path: morse-macos-aarch64.dmg
  
  build-debian:
    name: "Debian"
    if: |
      github.ref_type == 'tag' || 
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'All' || inputs.job == 'Debian'))
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{matrix.runner}}
    container: debian:sid
    steps:
      - uses: actions/checkout@v7
      - name: Build Package
        run: |
          apt update
          apt install -y debhelper devscripts
          apt build-dep -y .
          dpkg-buildpackage -b -uc -us
          mv ../morse-gtk_*.deb ./morse-linux-${{matrix.arch}}.deb
      - uses: actions/upload-artifact@v7
        with:
          name: morse-debian-${{matrix.arch}}
          path: morse-*.deb
  
  build-binary:
    name: "Linux Binary"
    if: |
      github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'All' || inputs.job == 'Binary (Linux)'))
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{matrix.runner}}
    container:
      image: fedora:rawhide
    steps:
      - uses: actions/checkout@v7
      - name: Install deps
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            meson git jq cargo gtk4-devel libadwaita-devel \
            blueprint-compiler alsa-lib-devel
      - name: Build Package
        run: |
          meson setup build -Dprofile=default --prefix=/usr
          meson compile -C build
          meson install -C build --strip --destdir $(pwd)/morse
          tar -czvf morse-v$(meson introspect --projectinfo build | jq -r .version)-${{matrix.arch}}.tar.gz -C morse .
      - uses: actions/upload-artifact@v7
        with:
          name: morse-linux-${{matrix.arch}}
          path: morse-*.tar.gz
  
  publish:
    name: Publish Release
    needs: [build-flatpak, build-windows, build-macos, build-debian, build-binary]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./binaries
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: ./binaries/*
          generate_release_notes: true
